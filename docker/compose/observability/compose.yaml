services:
  mimir:
    image: grafana/mimir:3.0.3
    container_name: mimir
    command: ["-config.file=/etc/mimir.yaml"]
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - type: volume
        source: nfs-general-data
        target: /etc/mimir.yaml
        volume:
          subpath: observability/mimir/mimir.yaml
      - type: volume
        source: nfs-general-data
        target: /data
        volume:
          subpath: observability/mimir/data

  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - type: volume
        source: nfs-general-data
        target: /var/lib/grafana
        volume:
          subpath: observability/grafana

  otel-collector:
    image: otel/opentelemetry-collector:0.145.0
    volumes:
      - type: volume
        source: nfs-general-data
        target: /etc/otelcol/
        volume:
          subpath: observability/otel
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

volumes:
  nfs-general-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.1.11,rw,nolock,soft,nfsvers=4"
      device: ":/mnt/general/data"
