---
# Public key of the gluetun side. Generate the pair on your workstation:
#   wg genkey | tee client.key | wg pubkey
# Private half -> Bitwarden Secrets Manager (wireguard_client_private_key).
# Public half  -> here.
wg_client_public_key: "" # TODO

# Must match qBittorrent's listening port. 0 disables the inbound forward,
# which means download-only with no seeding.
torrent_port: 51413

# Optional. Never commit a real value -- pass it at run time instead:
#   ansible-playbook playbooks/vpn-exit.yaml -e wg_preshared_key="$(...)"
wg_preshared_key: ""
