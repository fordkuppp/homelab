---
# Wings host. Unlike the edge VPS this box is already ON the LAN, so it joins
# the tailnet purely to be reachable from Bangkok -- it must NOT accept the
# homelab subnet routes it is already sitting inside.
tailscale_accept_routes: false
tailscale_tags: "tag:games"

# Tagged Tailscale pre-auth key. NEVER commit -- pass at run time from
# Bitwarden Secrets Manager:
#   ansible-playbook playbooks/composite/wings.yaml \
#     -e "tailscale_authkey=$(bws secret get $BWS_TS_GAMES_AUTHKEY_ID | jq -r .value)"
tailscale_authkey: "" # runtime only

# Node credentials the Panel generates when the Node is created. Runtime only,
# same handling as above. See ansible/README.md for where they come from.
pelican_node_uuid: ""     # runtime only
pelican_node_token_id: "" # runtime only
pelican_node_token: ""    # runtime only

# The cloud image's `ubuntu` user is a sudoer; everything this group does is root work.
ansible_become: true
