# The OIDC client is registered by hand in Pocket ID (there is no API for it),
# so its id and secret are carried through Bitwarden rather than the repo.
#
# freshrss_db_password must be alphanumeric. The container entrypoint builds
# the install command with `eval echo "$FRESHRSS_INSTALL"` and then splits it
# on whitespace, so a password containing a space, quote, backtick or $ would
# either break the install or be re-interpreted by the shell.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss
  namespace: freshrss
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: db_password
      remoteRef:
        key: freshrss_db_password
    - secretKey: oidc_client_id
      remoteRef:
        key: freshrss_oidc_client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: freshrss_oidc_client_secret
    - secretKey: oidc_crypto_key
      remoteRef:
        key: freshrss_oidc_crypto_key
