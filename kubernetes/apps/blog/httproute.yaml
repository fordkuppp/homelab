# Public: Caddy on the edge VPS -> https-public-blog listener. Its hostname is
# exact, so this route attaches to that listener only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
  namespace: blog
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - "blog.fordkuppp.me"
  rules:
    - backendRefs:
        - name: blog
          port: 8080
