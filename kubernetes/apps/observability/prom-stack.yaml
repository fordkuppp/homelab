apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 82.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    # Alert rules live in Grafana as Grafana-managed rules, imported through
    # /api/convert/prometheus and editable in the UI -- they are deliberately
    # not defined in files here. Only the *alerting* groups are switched off
    # below; every recording group stays on, because dashboards and other
    # rules depend on the series they produce.
    defaultRules:
      rules:
        alertmanager: false
        configReloaders: false
        general: false
        kubeApiserverSlos: false
        kubeStateMetrics: false
        kubernetesApps: false
        kubernetesResources: false
        kubernetesStorage: false
        kubernetesSystem: false
        network: false
        nodeExporterAlerting: false
        prometheus: false
        prometheusOperator: false
    grafana:
      grafana.ini:
        server:
          domain: grafana.local.fordkuppp.me
        unified_alerting:
          enabled: true
        database:
          type: postgres
          host: postgres-rw.postgres.svc.cluster.local:5432
          name: grafana
          user: grafana
          ssl_mode: disable
      sidecar:
        dashboards:
          provider:
            folder: Built in
      defaultDashboardsTimezone: Asia/Bangkok
      additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.observability.svc:3100
      # uid is pinned: the hand-made Steam metrics dashboard refers to it by
      # this exact value, so a regenerated one would leave it querying nothing.
      - name: TimescaleDB
        uid: cfk814jeejgg0f
        type: grafana-postgresql-datasource
        url: timescaledb-rw.metrics-exporter.svc.cluster.local:5432
        user: admin
        jsonData:
          database: metrics_exporter
          sslmode: disable
          timescaledb: true
        secureJsonData:
          password: ${TIMESCALEDB_PASSWORD}
      persistence:
        enabled: true
        storageClassName: nfs-csi
        size: 5Gi
        selectorLabels:
          app: grafana
      service:
        type: ClusterIP
      envValueFrom:
        DISCORD_WEBHOOK_URL:
          secretKeyRef:
            name: discord-webhook
            key: address
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-db
            key: password
        TIMESCALEDB_PASSWORD:
          secretKeyRef:
            name: timescaledb-grafana
            key: password
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
          - orgId: 1
            name: discord
            receivers:
            - uid: discord-receiver
              type: discord
              settings:
                url: ${DISCORD_WEBHOOK_URL}
        policies.yaml:
          apiVersion: 1
          policies:
          - orgId: 1
            receiver: discord
            group_by:
            - alertname
            - namespace
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        securityContext:
          fsGroup: 2000
          runAsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        retention: 90d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-csi
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 60Gi
              selector:
                matchLabels:
                  app: prometheus
    alertmanager:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
