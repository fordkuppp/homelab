apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 82.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    grafana:
      grafana.ini:  
        server:
          root_url: "https://grafana.local.fordkuppp.me"
      defaultDashboardsTimezone: Asia/Bangkok
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.observability.svc:3100
      service:
        type: ClusterIP
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-csi
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
              selector:
                matchLabels:
                  app: prometheus

    alertmanager:
      enabled: false
