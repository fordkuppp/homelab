apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 82.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    grafana:
      grafana.ini:
        server:
          domain: grafana.local.fordkuppp.me
        unified_alerting:
          enabled: true
      sidecar:
        dashboards:
          provider:
            folder: Built in
      defaultDashboardsTimezone: Asia/Bangkok
      additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.observability.svc:3100
      persistence:
        enabled: true
        storageClassName: nfs-csi
        size: 5Gi
        selectorLabels:
          app: grafana
      service:
        type: ClusterIP
      envValueFrom:
        DISCORD_WEBHOOK_URL:
          secretKeyRef:
            name: discord-webhook
            key: address
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
          - orgId: 1
            name: discord
            receivers:
            - uid: discord-receiver
              type: discord
              settings:
                url: ${DISCORD_WEBHOOK_URL}
        policies.yaml:
          apiVersion: 1
          policies:
          - orgId: 1
            receiver: discord
            group_by:
            - alertname
            - namespace
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
        rules.yaml:
          apiVersion: 1
          groups:
          - orgId: 1
            name: prometheus-passthrough
            folder: Alerts
            interval: 1m
            rules:
            - uid: prom-alerts-firing
              title: Prometheus alert firing
              condition: C
              for: 2m
              noDataState: OK
              execErrState: Error
              annotations:
                summary: A Prometheus alert is firing; see labels for which.
              data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  editorMode: code
                  expr: ALERTS{alertstate="firing", alertname!="Watchdog", severity=~"warning|critical"}
              - refId: B
                datasourceUid: __expr__
                model:
                  refId: B
                  type: reduce
                  reducer: last
                  expression: A
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: B
                  conditions:
                  - evaluator:
                      type: gt
                      params:
                      - 0
    prometheus:
      prometheusSpec:
        enableRemoteWriteReceiver: true
        securityContext:
          fsGroup: 2000
          runAsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        retention: 90d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-csi
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 60Gi
              selector:
                matchLabels:
                  app: prometheus
    alertmanager:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
