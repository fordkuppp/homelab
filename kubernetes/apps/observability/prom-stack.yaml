apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/prometheus-community/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 82.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    grafana:
      grafana.ini:  
        server:
          domain: "grafana.local.fordkuppp.me"
      defaultDashboardsTimezone: Asia/Bangkok
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.observability.svc:3100
        - name: Mimir
          type: prometheus
          url: http://mimir-query-frontend.observability.svc:8080/prometheus
          isDefault: true
      service:
        type: ClusterIP
    prometheus:
      enabled: false
    alertmanager:
      enabled: false
