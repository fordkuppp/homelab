apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-webhook
  namespace: observability
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: address
      remoteRef:
        key: discord_webhook_url
---
# Password for the TimescaleDB datasource. The datasource used to be hand-made
# in the UI, so it lived only in Grafana's database and was lost when that
# moved to Postgres; it is provisioned from prom-stack.yaml now so that cannot
# happen again. Same Bitwarden key the metrics-exporter itself uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: timescaledb-grafana
  namespace: observability
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: password
      remoteRef:
        key: metrics_exporter_db_password
