apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.146.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  values:
    image:
      repository: otel/opentelemetry-collector-contrib
    mode: daemonset
    presets:
      logsCollection:
        enabled: true
    service:
      enabled: true
      type: ClusterIP
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
      exporters:
        prometheusremotewrite/mimir:
          endpoint: http://mimir-distributor.observability.svc:8080/api/v1/push
          headers:
            X-Scope-OrgID: anonymous
        otlphttp/loki:
          endpoint: http://loki.observability.svc:3100/otlp
      processors:
        batch: {}
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheusremotewrite/mimir]
          logs:
            receivers: [otlp, filelog]
            processors: [batch]
            exporters: [otlphttp/loki]
