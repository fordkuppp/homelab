apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: observability
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.146.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
  values:
    image:
      repository: otel/opentelemetry-collector-contrib
    mode: deployment
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
      exporters:
        prometheusremotewrite:
          endpoint: http://kube-prometheus-stack-prometheus.observability.svc:9090/api/v1/write
      processors:
        batch: {}
      service:
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheusremotewrite]
