# The Envoy Gateway *controller* was already scraped, but the data-plane proxy
# was not -- which is why no envoy_http_downstream_* series existed and there
# was no way to see ingress traffic at all.
#
# Two things make this easy to get wrong:
#   - Envoy serves stats at /stats/prometheus, not /metrics. /metrics is a 404.
#   - One proxy pod serves BOTH frontends: the LAN MetalLB service
#     envoy-gateway-lan (192.168.1.3, primary) and the Tailscale gateway both
#     select it, so this single monitor covers all ingress.
#
# Envoy stats are very high cardinality -- it exposes thousands of series per
# cluster and listener. The keep list below holds that down to the handful
# worth storing, which matters here because this TSDB has been wedged before.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  # any: true to match the other PodMonitors here; the label selector below is
  # specific enough on its own -- only Envoy Gateway's proxy pods carry both.
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "envoy_http_downstream_rq_xx|envoy_http_downstream_rq_total|envoy_http_downstream_rq_time_(bucket|count|sum)|envoy_http_downstream_cx_active|envoy_http_downstream_cx_total|envoy_http_downstream_rq_timeout|envoy_cluster_upstream_rq_xx|envoy_cluster_upstream_rq_total|envoy_cluster_upstream_rq_time_(bucket|count|sum)|envoy_cluster_membership_healthy|envoy_cluster_membership_total|envoy_cluster_upstream_cx_active|envoy_server_live|envoy_server_uptime|envoy_server_memory_allocated"
          action: keep
