# local-path enforces no quota: every local-path PVC writes into the node root
# filesystem and its `size:` is advisory only. The built-in node-exporter rules
# cover a fast fill (NodeFilesystemSpaceFillingUp needs the disk predicted full
# within 24h) and a nearly-full disk (NodeFilesystemAlmostOutOfSpace at 5%), but
# a slow fill trips neither until there are only a few GB left -- which on this
# single-node cluster takes the apiserver down with it. This rule covers that gap.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-local-storage
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-local-storage
      rules:
        - alert: NodeRootFilesystemLowHeadroom
          expr: |
            node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"}
              / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"} * 100 < 20
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Node root filesystem is below 20% free.
            description: >-
              local-path PVCs and the container image store share this filesystem
              and neither is capped. To find what grew, on the node run:
              du -xh --max-depth=1 / | sort -h, then
              du -sh /var/lib/rancher/k3s/storage/* | sort -h for the PVCs.
