# Envoy's OIDC filter reads the client credentials from these exact keys
# (client-id / client-secret). Both come from the OIDC client created in
# Pocket ID for share.app.fordkuppp.me; see docs/runbooks/send.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: send-oidc
  namespace: send
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: client-id
      remoteRef:
        key: send_oidc_client_id
    - secretKey: client-secret
      remoteRef:
        key: send_oidc_client_secret
