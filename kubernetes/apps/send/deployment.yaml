# Send (timvisee's fork of Firefox Send): upload a file, get a link that
# expires after N downloads or a deadline. Files are encrypted in the browser,
# so the server only ever stores ciphertext.
#
# Valkey runs as a sidecar rather than its own Deployment: Send is the only
# client, it talks over localhost, and the two have no reason to restart
# independently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: send
  namespace: send
  labels:
    app.kubernetes.io/name: send
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: send
  template:
    metadata:
      labels:
        app.kubernetes.io/name: send
    spec:
      enableServiceLinks: false
      containers:
        - name: send
          image: registry.gitlab.com/timvisee/send:v3.5.1
          env:
            # Public URL. Send derives the share links, the CSP and the
            # websocket origin from it, so it must be the address users see,
            # not the gateway's.
            - name: BASE_URL
              value: https://share.app.fordkuppp.me
            - name: REDIS_HOST
              value: 127.0.0.1
            - name: FILE_DIR
              value: /uploads
            # Defaults, made explicit because the cleanup CronJob and the
            # runbook reason about them.
            - name: MAX_EXPIRE_SECONDS
              value: "604800"
            - name: DEFAULT_EXPIRE_SECONDS
              value: "86400"
            - name: DEFAULT_DOWNLOADS
              value: "1"
          ports:
            - name: http
              containerPort: 1443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /__lbheartbeat__
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          # __heartbeat__ pings the storage backend, so readiness also covers
          # the Valkey sidecar coming up.
          readinessProbe:
            httpGet:
              path: /__heartbeat__
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /uploads
        - name: valkey
          image: valkey/valkey:9.1.3-alpine
          args:
            - valkey-server
            - --bind
            - 127.0.0.1
            - --appendonly
            - "yes"
            - --save
            - "60 1"
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 30
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: send-uploads-pvc
        - name: valkey-data
          persistentVolumeClaim:
            claimName: send-valkey-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: send
  namespace: send
spec:
  selector:
    app.kubernetes.io/name: send
  ports:
    - name: http
      port: 1443
      targetPort: http
