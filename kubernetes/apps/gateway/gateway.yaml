apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailscale-gateway
  namespace: tailscale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: tailscale-envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.local.fordkuppp.me"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-local-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.local.fordkuppp.me"
      allowedRoutes:
        namespaces:
          from: All
    # Internet-facing apps. Traffic arrives from Caddy on the edge VPS, which
    # terminates the public TLS and re-encrypts to this listener over the
    # tailnet. Terminating TLS here too (rather than a plain-HTTP listener)
    # keeps Envoy's OIDC filter on its documented footing: it sees HTTPS
    # natively, so no forwarded-proto trust is involved. cert-manager issues
    # the wildcard from the annotation above, same as the local one.
    - name: https-public
      protocol: HTTPS
      port: 443
      hostname: "*.app.fordkuppp.me"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-app-tls
      allowedRoutes:
        namespaces:
          from: All
    # Public apps on a bare <name>.fordkuppp.me, for things people link to and
    # keep (the *.app wildcard is for tools). One listener per host with an
    # EXACT hostname: a `*.fordkuppp.me` listener would also match every
    # *.local route, since Gateway API wildcards span any number of labels.
    # All of them share `public-tls`; cert-manager issues one certificate
    # covering every listener that references it.
    - name: https-public-blog
      protocol: HTTPS
      port: 443
      hostname: blog.fordkuppp.me
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-tls
      allowedRoutes:
        namespaces:
          from: All
