apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tailscale-gateway
  namespace: tailscale
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  gatewayClassName: tailscale-envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.local.fordkuppp.me"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-local-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.local.fordkuppp.me"
      allowedRoutes:
        namespaces:
          from: All
    # Internet-facing apps. Traffic arrives from Caddy on the edge VPS, which
    # terminates the public TLS and re-encrypts to this listener over the
    # tailnet. Terminating TLS here too (rather than a plain-HTTP listener)
    # keeps Envoy's OIDC filter on its documented footing: it sees HTTPS
    # natively, so no forwarded-proto trust is involved. cert-manager issues
    # the wildcard from the annotation above, same as the local one.
    - name: https-public
      protocol: HTTPS
      port: 443
      hostname: "*.app.fordkuppp.me"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-app-tls
      allowedRoutes:
        namespaces:
          from: All
