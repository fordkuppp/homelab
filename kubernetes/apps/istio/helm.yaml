apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio
  namespace: istio-system
spec:
  interval: 1h
  url: https://istio-release.storage.googleapis.com/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 5m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: base
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    defaultRevision: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  dependsOn:
    - name: istio-base
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: istiod
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    global:
      platform: k3s
    meshConfig:
      defaultConfig:
        proxyMetadata:
          ISTIO_META_DNS_CAPTURE: "true"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  dependsOn:
    - name: istiod
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cni
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    global:
      platform: k3s
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  dependsOn:
    - name: istio-cni
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: ztunnel
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    profile: ambient
    global:
      platform: k3s
