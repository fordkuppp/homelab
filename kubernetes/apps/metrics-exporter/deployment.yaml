apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  namespace: metrics-exporter
  labels:
    app.kubernetes.io/name: metrics-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-exporter
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          command:
            - sh
            - -c
            - "until nc -z timescaledb-rw 5432; do echo 'waiting for timescaledb...'; sleep 2; done"
      containers:
        - name: metrics-exporter
          image: ghcr.io/fordkuppp/metrics-exporter:latest
          imagePullPolicy: Always
          env:
            - name: APP_STEAM__API_KEY
              valueFrom:
                secretKeyRef:
                  name: metrics-exporter-steam
                  key: steam_api_key
            - name: APP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secret
                  key: database_url
          volumeMounts:
            - name: config
              mountPath: /usr/local/metrics-exporter/config/local.toml
              subPath: local.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metrics-exporter-config
