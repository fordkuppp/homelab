apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
  namespace: metrics-exporter
  labels:
    app.kubernetes.io/name: metrics-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-exporter
    spec:
      containers:
        - name: metrics-exporter
          image: ghcr.io/fordkuppp/metrics-exporter:latest
          env:
            - name: APP_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metrics-exporter-steam
                  key: steam_api_key
          volumeMounts:
            - name: config
              mountPath: /usr/local/metrics-exporter/config/local.toml
              subPath: local.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metrics-exporter-config
