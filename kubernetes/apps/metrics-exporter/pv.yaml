apiVersion: v1
kind: PersistentVolume
metadata:
  name: timescaledb-pv
  labels:
    app: timescaledb
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: timescaledb-pv
    volumeAttributes:
      server: 192.168.1.11
      share: /mnt/general/data/metrics-exporter/postgres
