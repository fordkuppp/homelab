apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: timescaledb-dump
  namespace: metrics-exporter
spec:
  backupCommand: /bin/sh -c 'pg_dumpall --clean --if-exists'
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: dump
          image: timescale/timescaledb-ha:pg18
          command: ["sleep", "infinity"]
          env:
            - name: PGHOST
              value: timescaledb-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secret
                  key: password
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: metrics-exporter
  namespace: metrics-exporter
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/metrics-exporter
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "45 2 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "15 5 * * 0"
  prune:
    schedule: "50 3 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
