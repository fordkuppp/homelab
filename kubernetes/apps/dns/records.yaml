apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: edge-vps
  namespace: dns
  annotations:
    # DERP terminates its own TLS and runs its own ACME -- Cloudflare must NOT
    # proxy this (grey cloud), or the relay and cert issuance break.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  endpoints:
    - dnsName: derp.fordkuppp.me
      recordType: A
      recordTTL: 300
      targets:
        - 117.18.125.44 # edge VPS, first IP (derper)
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: games
  namespace: dns
  annotations:
    # Minecraft is raw TCP. The Cloudflare proxy only carries HTTP, so it must
    # stay off (grey cloud) or every connection is dropped.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  endpoints:
    # Wildcard on purpose: game servers are told apart by the hostname in the
    # Minecraft handshake, which Caddy matches on the shared 25565 listener.
    # Adding a server is then one line in the Caddyfile -- no record per server.
    - dnsName: "*.games.fordkuppp.me"
      recordType: A
      recordTTL: 300
      targets:
        - 117.18.125.45 # edge VPS, second IP (Caddy)
---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: app
  namespace: dns
  annotations:
    # Caddy on the VPS does its own ACME on this IP, and the free Cloudflare
    # proxy caps uploads at 100 MB -- fatal for a file-sharing app. Grey cloud.
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  endpoints:
    # Wildcard, like *.games: a public HTTP app is then a site block in the
    # VPS's Caddyfile plus an HTTPRoute on the https-public listener, with no
    # DNS step.
    - dnsName: "*.app.fordkuppp.me"
      recordType: A
      recordTTL: 300
      targets:
        - 117.18.125.45 # edge VPS, second IP (Caddy)
