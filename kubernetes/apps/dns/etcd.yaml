apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: dns
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: etcd
      version: "11.*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  install:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    auth:
      rbac:
        create: false
      client:
        secureTransport: false
    persistence:
      enabled: true
      size: 1Gi
