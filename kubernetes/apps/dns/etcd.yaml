apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: dns
spec:
  type: oci
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: etcd
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: etcd
      version: "12.0.18"
      sourceRef:
        kind: HelmRepository
        name: bitnami
  install:
    remediation:
      retries: 3
  values:
    global:
      security:
        allowInsecureImages: true
    image:
      registry: gcr.io
      repository: etcd-development/etcd
      tag: v3.6.8
    replicaCount: 1
    auth:
      rbac:
        create: false
      client:
        secureTransport: false
    persistence:
      enabled: true
      size: 1Gi
