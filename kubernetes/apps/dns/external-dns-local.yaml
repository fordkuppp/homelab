apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-local
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: external-dns
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    remediation:
      retries: 3
  values:
    provider:
      name: rfc2136
    sources:
      - gateway-httproute
    domainFilters:
      - local.fordkuppp.me
    policy: sync
    txtOwnerId: external-dns-local
    extraArgs:
      - --rfc2136-host=technitium-dns.dns.svc.cluster.local
      - --rfc2136-port=53
      - --rfc2136-zone=local.fordkuppp.me
      - --rfc2136-tsig-keyname=external-dns
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
      - --default-targets=192.168.1.3
      - --force-default-targets
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-tsig-secret
            key: tsig-secret
