apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-public
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: external-dns
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: external-dns
  install:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    # Public records are declared explicitly as DNSEndpoint CRDs (edge/VPS
    # targets), not derived from in-cluster Gateways -- those are internal and
    # owned by external-dns-local.
    sources:
      - crd
    domainFilters:
      - fordkuppp.me
    # The Cloudflare zone also holds hand-made records and the public
    # local.fordkuppp.me entries. upsert-only means this instance never deletes
    # anything -- it only creates/updates records it owns via DNSEndpoints.
    policy: upsert-only
    txtOwnerId: external-dns-public
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
