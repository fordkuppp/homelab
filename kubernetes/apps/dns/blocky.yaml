apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 1h
  url: https://0xerr0r.github.io/blocky/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: blocky
      version: "0.*"
      sourceRef:
        kind: HelmRepository
        name: blocky
  install:
    remediation:
      retries: 3
  values:
    service:
      dns:
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: blocky
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            port: 53
            protocol: UDP
            targetPort: 53
    config:
      upstreams:
        groups:
          default:
            - 1.1.1.1
            - 8.8.8.8
      blocking:
        denylists:
          ads:
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        clientGroupsBlock:
          default:
            - ads
      ports:
        dns: 53
