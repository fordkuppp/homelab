apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 1h
  url: https://johanneskastl.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: blocky
      version: "11.*"
      sourceRef:
        kind: HelmRepository
        name: blocky
  install:
    remediation:
      retries: 3
  values:
    service:
      dns:
        enabled: true
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: blocky
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53
    config: |
      upstream:
        default:
          - 1.1.1.1
          - 8.8.8.8
      blocking:
        blackLists:
          ads:
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        clientGroupsBlock:
          default:
            - ads
      port: 53
      httpPort: 4000
      bootstrapDns: tcp+udp:1.1.1.1
