apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 1h
  url: https://johanneskastl.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: blocky
      version: "11.*"
      sourceRef:
        kind: HelmRepository
        name: blocky
  install:
    remediation:
      retries: 3
  values:
    service:
      main:
        enabled: true
        ports:
          http:
            port: 4000
      dns:
        enabled: true
        externalTrafficPolicy: ""
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53
    config: |
      upstreams:
        groups:
          default:
            - 1.1.1.1
            - 8.8.8.8
      blocking:
        denylists:
          ads:
            - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
        clientGroupsBlock:
          default:
            - ads
      ports:
        dns: 53
        http: 4000
      bootstrapDns: tcp+udp:1.1.1.1
