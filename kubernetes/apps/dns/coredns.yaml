apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 1h
  url: https://coredns.github.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: coredns
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: coredns
  install:
    remediation:
      retries: 3
  values:
    isClusterService: false
    serviceType: LoadBalancer
    service:
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: coredns
    servers:
      - zones:
          - zone: local.mydomain.me.
        port: 53
        plugins:
          - name: file
            parameters: /etc/coredns/local.mydomain.me.db
          - name: log
          - name: errors
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: forward
            parameters: . blocky.dns.svc.cluster.local
          - name: cache
            parameters: 30
          - name: log
          - name: errors
    zoneFiles:
      - filename: local.mydomain.me.db
        domain: local.mydomain.me
        contents: |
          local.mydomain.me.   IN SOA  ns.local.mydomain.me. admin.local.mydomain.me. 2024010100 3600 600 86400 60
          local.mydomain.me.   IN NS   ns.local.mydomain.me.
          ; Add A records below pointing to the Gateway's Tailscale IP
          ; Example: immich.local.mydomain.me.  IN  A  100.x.y.z
