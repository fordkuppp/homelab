apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 1h
  url: https://coredns.github.io/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
  namespace: dns
spec:
  interval: 5m0s
  chart:
    spec:
      chart: coredns
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: coredns
  install:
    remediation:
      retries: 3
  values:
    isClusterService: false
    serviceType: LoadBalancer
    service:
      loadBalancerClass: tailscale
      annotations:
        tailscale.com/hostname: coredns
    servers:
      - zones:
          - zone: local.fordkuppp.me.
        port: 53
        plugins:
          - name: etcd
            parameters: local.fordkuppp.me
            configBlock: |-
              endpoint http://etcd.dns.svc.cluster.local:2379
          - name: log
          - name: errors
          - name: cache
            parameters: 30
      - zones:
          - zone: .
        port: 53
        plugins:
          - name: forward
            parameters: . 1.1.1.1 8.8.8.8
          - name: cache
            parameters: 30
          - name: log
          - name: errors
