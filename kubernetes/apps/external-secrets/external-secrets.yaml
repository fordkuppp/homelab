apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: external-secrets
      version: 2.13.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
  values:
    bitwarden-sdk-server:
      enabled: true
  # bitwarden-sdk-server loads its TLS keypair once at startup. cert-manager
  # renews bitwarden-tls-certs ~30 days before expiry and the pod keeps serving
  # the old cert, breaking every ExternalSecret until it is restarted by hand.
  # The subchart exposes no deployment annotations, so patch it post-render and
  # let Reloader (systems-install) restart it on secret change.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              group: apps
              kind: Deployment
              name: bitwarden-sdk-server
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: bitwarden-sdk-server
                annotations:
                  reloader.stakater.com/auto: "true"
