apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 1m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.12.0
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  values:
    controller:
      runOnControlPlane: true
