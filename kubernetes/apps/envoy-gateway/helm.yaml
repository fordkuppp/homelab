apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  type: oci
  interval: 1h
  url: oci://docker.io/envoyproxy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: gateway-helm
      version: "1.*"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
  install:
    remediation:
      retries: 3
