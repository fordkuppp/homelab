apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 5m0s
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 5m0s
  chart:
    spec:
      chart: tailscale-operator
      version: 1.94.*
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 5m
  install:
    remediation:
      retries: 3
  values: {}