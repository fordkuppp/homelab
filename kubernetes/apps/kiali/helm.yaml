apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kiali
  namespace: kiali
spec:
  interval: 1h
  url: https://kiali.org/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali-server
  namespace: kiali
spec:
  interval: 5m0s
  install:
    remediation:
      retries: 3
  chart:
    spec:
      chart: kiali-server
      version: 2.33.0
      sourceRef:
        kind: HelmRepository
        name: kiali
  values:
    istio_namespace: istio-system
    auth:
      strategy: anonymous
    deployment:
      view_only_mode: true
    external_services:
      prometheus:
        url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      grafana:
        enabled: true
        internal_url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local
        external_url: https://grafana.local.fordkuppp.me
      tracing:
        enabled: false
