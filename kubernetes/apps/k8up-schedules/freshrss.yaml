# Only the config, favicons and extensions live here. Feeds, entries and read
# state are in Postgres and come back from the pg_dumpall in that namespace.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: freshrss
  namespace: freshrss
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/freshrss
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "55 3 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "30 7 * * 0"
  prune:
    schedule: "40 4 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
