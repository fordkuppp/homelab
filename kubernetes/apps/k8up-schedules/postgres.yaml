apiVersion: k8up.io/v1
kind: PreBackupPod
metadata:
  name: postgres-dump
  namespace: postgres
spec:
  backupCommand: /bin/sh -c 'pg_dumpall --clean --if-exists'
  fileExtension: .sql
  pod:
    spec:
      containers:
        - name: dump
          image: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixie
          command: ["sleep", "infinity"]
          env:
            - name: PGHOST
              value: postgres18-rw
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
---
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: postgres
  namespace: postgres
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/postgres
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "30 2 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "0 5 * * 0"
  prune:
    schedule: "40 3 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
