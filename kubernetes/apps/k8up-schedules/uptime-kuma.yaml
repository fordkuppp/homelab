apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/uptime-kuma
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "50 3 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "15 7 * * 0"
  prune:
    schedule: "35 4 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
