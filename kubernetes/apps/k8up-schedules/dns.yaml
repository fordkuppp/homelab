apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: dns
  namespace: dns
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/dns
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "10 2 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "15 6 * * 0"
  prune:
    schedule: "15 4 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
