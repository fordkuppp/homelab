# The whole app state: UpSnap keeps devices, users and OIDC config in SQLite.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: upsnap
  namespace: upsnap
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/upsnap
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "5 4 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "30 7 * * 0"
  prune:
    schedule: "40 4 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
