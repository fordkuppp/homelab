apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
  annotations:
    k8up.io/backup: "false"
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi-media
  resources:
    requests:
      storage: 2Ti
  volumeName: media-data-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config-pvc
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-pvc
  namespace: media
  annotations:
    k8up.io/backup-restic-args: '["--exclude=/data/prowlarr-config-pvc/logs"]'
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
