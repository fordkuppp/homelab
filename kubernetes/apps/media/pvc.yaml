apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data-pvc
  namespace: media
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi-media
  resources:
    requests:
      storage: 2Ti
  volumeName: media-data-pv
