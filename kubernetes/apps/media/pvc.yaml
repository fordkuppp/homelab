apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-jellyfin-config-pvc
  namespace: media
  annotations:
    k8up.io/backup-restic-args: '["--exclude=/data/media-jellyfin-config-pvc/metadata","--exclude=/data/media-jellyfin-config-pvc/data/subtitles","--exclude=/data/media-jellyfin-config-pvc/log","--exclude=/data/media-jellyfin-config-pvc/cache","--exclude=/data/media-jellyfin-config-pvc/transcodes"]'
