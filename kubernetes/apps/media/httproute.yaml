apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: media
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - "qbittorrent.local.fordkuppp.me"
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 8080
