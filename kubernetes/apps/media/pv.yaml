apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-data-pv
  labels:
    app: media
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi-media
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media-data-pv
    volumeAttributes:
      server: 192.168.1.11
      share: /mnt/general/media
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-jellyfin-config-pv
  labels:
    app: media
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: media-jellyfin-config-pv
    volumeAttributes:
      server: 192.168.1.11
      share: /mnt/general/data/jellyfin
