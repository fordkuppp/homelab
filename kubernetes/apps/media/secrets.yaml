apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airvpn
  namespace: media
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: airvpn_wireguard_private_key
    - secretKey: WIREGUARD_PRESHARED_KEY
      remoteRef:
        key: airvpn_wireguard_preshared_key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: airvpn_wireguard_addresses
    - secretKey: FORWARDED_PORT
      remoteRef:
        key: airvpn_forwarded_port
