apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: media
  namespace: media
spec:
  backend:
    repoPasswordSecretRef:
      name: k8up-repo
      key: password
    s3:
      bucket: homelab-backups/media
      accessKeyIDSecretRef:
        name: k8up-repo
        key: access_key
      secretAccessKeySecretRef:
        name: k8up-repo
        key: secret_key
  backup:
    schedule: "0 3 * * *"
    failedJobsHistoryLimit: 3
    successfulJobsHistoryLimit: 1
  check:
    schedule: "30 5 * * 0"
  prune:
    schedule: "0 4 * * *"
    retention:
      keepDaily: 14
      keepWeekly: 8
      keepMonthly: 6
