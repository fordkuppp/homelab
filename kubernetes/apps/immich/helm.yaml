apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m0s
  provider: generic
  url: oci://ghcr.io/immich-app/immich-charts/immich
  ref:
    tag: 0.10.3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 5m0s
  chartRef:
    kind: OCIRepository
    name: immich
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.5.6
    immich:
      persistence:
        library:
          existingClaim: immich-pvc
    valkey:
      enabled: true
