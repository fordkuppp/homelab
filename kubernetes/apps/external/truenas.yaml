# Convenience route only; keep https://192.168.1.11 for when the cluster is down. Pins TrueNAS's self-signed default cert (CN/SAN localhost), which expires 2027-01-29 -- re-pin or switch TrueNAS to an ACME cert before then.
apiVersion: v1
kind: Service
metadata:
  name: truenas
  namespace: external
spec:
  ports:
    - name: https
      port: 443
      targetPort: 443
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas
  namespace: external
  labels:
    kubernetes.io/service-name: truenas
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - "192.168.1.11"
---
