apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: truenas
  namespace: external
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: truenas
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: truenas-ca
    hostname: localhost
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  namespace: external
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - "nas.local.fordkuppp.me"
  rules:
    - backendRefs:
        - name: truenas
          port: 443
---
# Consoles and the UI run over long-lived websockets
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: truenas
  namespace: external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: truenas
  timeout:
    http:
      requestTimeout: "0s"
