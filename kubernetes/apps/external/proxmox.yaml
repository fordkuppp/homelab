# Convenience route only. Proxmox hosts this cluster, so keep https://192.168.1.10:8006 as the way in when it is down. CA is /etc/pve/pve-root-ca.pem (valid to 2034); the node cert's SANs include "lab".
apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: external
spec:
  ports:
    - name: https
      port: 8006
      targetPort: 8006
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox
  namespace: external
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
ports:
  - name: https
    port: 8006
endpoints:
  - addresses:
      - "192.168.1.10"
---
