apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: proxmox
  namespace: external
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: proxmox
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: proxmox-ca
    hostname: lab
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox
  namespace: external
spec:
  parentRefs:
    - name: tailscale-gateway
      namespace: tailscale
  hostnames:
    - "pve.local.fordkuppp.me"
  rules:
    - backendRefs:
        - name: proxmox
          port: 8006
---
# Consoles and the UI run over long-lived websockets
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: proxmox
  namespace: external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: proxmox
  timeout:
    http:
      requestTimeout: "0s"
