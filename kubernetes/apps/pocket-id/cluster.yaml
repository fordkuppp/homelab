apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pocket-id-postgres
  namespace: pocket-id
spec:
  instances: 1
  inheritedMetadata:
    annotations:
      k8up.io/backup: "false"
  storage:
    storageClass: local-path
    size: 5Gi
  bootstrap:
    initdb:
      database: pocketid
      owner: pocketid
      secret:
        name: db-secret
