apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8up-r2
  namespace: k8up
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: endpoint
      remoteRef:
        key: cloudflare_r2_endpoint
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: k8up-repo
spec:
  externalSecretName: k8up-repo
  refreshTime: 1h0m0s
  namespaceSelectors:
    - matchLabels:
        k8up-backup: enabled
  externalSecretSpec:
    refreshInterval: 1h0m0s
    secretStoreRef:
      name: bitwarden-secretsmanager
      kind: ClusterSecretStore
    data:
      - secretKey: password
        remoteRef:
          key: k8up_restic_password
      - secretKey: access_key
        remoteRef:
          key: cloudflare_r2_access_key
      - secretKey: secret_key
        remoteRef:
          key: cloudflare_r2_secret_key
