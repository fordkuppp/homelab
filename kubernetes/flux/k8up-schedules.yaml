apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8up-schedules
  namespace: flux-system
spec:
  interval: 10m0s
  path: kubernetes/apps/k8up-schedules
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    - name: k8up
