apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: systems
  namespace: flux-system
spec:
  interval: 10m0s
  path: kubernetes/apps/systems
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    - name: systems-install
    - name: external-secrets
  postBuild:
    substituteFrom:
      - kind: Secret
        name: sops
