apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  interval: 10m0s
  path: kubernetes/apps/gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager
    - name: tailscale
    - name: systems
