---
# Provision the whole edge VPS in one run: harden the host, stand up the DERP
# relay, the bot challenge (no-op unless anubis_enabled), the public gateway,
# then the telemetry agent. import_playbook paths are relative to this file, so ../ points back
# to the playbooks root.
- import_playbook: ../baseline.yaml
- import_playbook: ../tailscale-derp.yaml
- import_playbook: ../anubis.yaml
- import_playbook: ../caddy-gateway.yaml
- import_playbook: ../otel-collector.yaml
  vars:
    otelcol_hosts: edge
