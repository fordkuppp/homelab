---
# Ships each box's metrics and logs to the cluster's OpenTelemetry Collector
# over the tailnet. What is collected is the hand-written file under
# roles/otel_collector/files/ that the group's otelcol_config_file names.
- name: Install the OpenTelemetry Collector
  hosts: edge:games
  become: true
  roles:
    - otel_collector
