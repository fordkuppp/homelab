---
# Public reverse-proxy on the edge VPS's second IP. Terminates HTTPS for your
# public hostnames and proxies to homelab services over the tailnet (the box is
# already a tailnet node from the tailscale-derp role). Run tailscale-derp
# FIRST so derper is rebound to the first IP, freeing the second IP's :443.
- name: Configure the public reverse-proxy gateway
  hosts: edge
  become: true
  roles:
    # Guarded so composite/edge.yml can import this unconditionally; it no-ops
    # until you define an HTTP site in caddy_sites or a raw-TCP forward in
    # caddy_l4_routes. A game-server forward with no HTTP sites is legitimate.
    - role: caddy_gateway
      when: (caddy_sites | length > 0) or (caddy_l4_routes | default([]) | length > 0)
