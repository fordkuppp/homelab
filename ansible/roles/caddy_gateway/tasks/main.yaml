---
- name: Install prerequisites for the Caddy apt repository
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
      - python3-debian # deb822_repository needs it on the target
    state: present
    update_cache: true

# deb822_repository fetches the signing key itself and keeps it beside the
# source as /etc/apt/keyrings/caddy-stable.asc.
- name: Add the Caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

# What apt_repository wrote before the move to deb822. Left in place, apt
# would see the same repository twice.
- name: Remove the old one-line Caddy source and its key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy-stable.list
    - /usr/share/keyrings/caddy-stable-archive-keyring.asc

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

# --- Custom binary with caddy-l4 (built on the controller, shipped to the VPS) ---
# Same reasoning as derper: the VPS is a small box, so compile where there is
# CPU and a reliable uplink. Requires Go on the controller.
- name: Install xcaddy on the controller
  delegate_to: localhost
  run_once: true
  become: false # build as the local user (uses your Go cache), not root
  ansible.builtin.command:
    cmd: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
  changed_when: false
  check_mode: false # controller-only; the build below needs it in --check too

- name: Resolve the controller's Go build paths
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.command:
    cmd: go env GOPATH
  register: caddy_go_env
  changed_when: false
  check_mode: false # read-only; later tasks need its output in --check too

- name: Create the controller's build cache directory
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.file:
    path: "{{ caddy_build_dir }}"
    state: directory
    mode: "0755"
  check_mode: false # controller-only; the build below needs it in --check too

- name: Build Caddy with caddy-l4 for {{ caddy_build_goos }}/{{ caddy_build_goarch }}
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.command:
    cmd: >-
      {{ caddy_go_env.stdout }}/bin/xcaddy build {{ caddy_version }}
      --with github.com/mholt/caddy-l4@{{ caddy_l4_version }}
      --output {{ caddy_build_artifact }}
    creates: "{{ caddy_build_artifact }}"
  environment:
    GOOS: "{{ caddy_build_goos }}"
    GOARCH: "{{ caddy_build_goarch }}"
  # Builds on the controller only, never the VPS, so it runs in --check too:
  # the ship step below needs the artifact to diff against.
  check_mode: false

- name: Ship the custom Caddy binary to the VPS
  ansible.builtin.copy:
    src: "{{ caddy_build_artifact }}"
    dest: "{{ caddy_custom_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart Caddy

- name: Create the Caddy systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Point the systemd unit at the custom binary
  ansible.builtin.template:
    src: systemd-override.conf.j2
    dest: /etc/systemd/system/caddy.service.d/10-custom-binary.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Caddy

# Validated with the custom binary on purpose: the apt one has no layer4 and
# would reject a Caddyfile that is in fact correct.
- name: Install the Caddyfile
  ansible.builtin.copy:
    src: Caddyfile
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "{{ caddy_custom_bin }} validate --adapter caddyfile --config %s"
  notify: Reload Caddy

# Reload here rather than leaning on the Reload systemd handler: handlers flush
# at the END of the play, so on a first install this start would run the apt
# unit's ExecStart -- a Caddy with no layer4 -- which exits 1 on the layer4
# block and aborts the play before the handler ever fires.
- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
    daemon_reload: true
