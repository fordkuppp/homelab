---
wg_config_dir: /etc/wireguard
wg_interface: wg0
wg_listen_port: 51820
wg_mtu: 1420

# Tunnel addressing. The server holds .1, the gluetun sidecar holds .2.
wg_subnet: 10.13.13.0/24
wg_server_address: 10.13.13.1/24
wg_client_address: 10.13.13.2/32
wg_client_ip: "{{ wg_client_address.split('/')[0] }}"

# Required. Generated on your workstation so the private half never leaves it.
wg_client_public_key: ""

# Optional extra symmetric layer. Keep it out of git -- pass with --extra-vars
# or pull it from SOPS.
wg_preshared_key: ""

# Public address peers dial. Override when the VPS sits behind provider NAT.
wg_endpoint_ip: "{{ ansible_default_ipv4.address }}"
wg_wan_interface: "{{ ansible_default_ipv4.interface }}"

# Inbound BitTorrent port, DNAT'd down the tunnel. Must match qBittorrent's
# listening port. Set to 0 to skip the forward entirely.
torrent_port: 51413
