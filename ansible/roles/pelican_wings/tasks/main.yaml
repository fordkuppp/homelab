---
- name: Fail fast on missing node credentials
  ansible.builtin.assert:
    that:
      - pelican_node_uuid | length > 0
      - pelican_node_token_id | length > 0
      - pelican_node_token | length > 0
    fail_msg: >-
      Node credentials are unset. The Panel generates them when you create the
      Node (Admin -> Nodes -> Create); there is no API to bootstrap them cold.
      Store them in Bitwarden and point the lookups in
      inventory/group_vars/games.yaml at their IDs -- see ansible/README.md.

- name: Create the Wings directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ pelican_wings_config_dir }}"
    - "{{ pelican_wings_root }}"
    - "{{ pelican_wings_data }}"

# Only the mount point -- no owner or mode. Once the share is mounted this path
# IS the TrueNAS dataset root, and enforcing root:root 0700 on a re-run would
# rewrite the dataset's own ownership and permissions.
- name: Create the backup mount point
  ansible.builtin.file:
    path: "{{ pelican_wings_backup_dir }}"
    state: directory

# Backups go straight to TrueNAS so world data outlives the VM. `soft` so a NAS
# outage stalls backups instead of wedging every process that touches the path.
- name: Mount the TrueNAS backup share at Wings' backup directory
  ansible.posix.mount:
    path: "{{ pelican_wings_backup_dir }}"
    src: "{{ pelican_backup_nfs_server }}:{{ pelican_backup_nfs_export }}"
    fstype: nfs
    opts: "rw,soft,nfsvers=4,_netdev"
    state: mounted

# The checksums URL is versioned alongside the binary, so this verifies the
# download without pinning a digest that every Renovate bump would invalidate.
- name: Install the Wings binary
  ansible.builtin.get_url:
    url: "{{ _pelican_wings_release }}/wings_linux_{{ pelican_wings_arch }}"
    checksum: "sha256:{{ _pelican_wings_release }}/checksums.txt"
    dest: "{{ pelican_wings_bin }}"
    owner: root
    group: root
    mode: "0755"
  vars:
    _pelican_wings_release: >-
      https://github.com/pelican/wings/releases/download/{{ pelican_wings_version }}
  notify: Restart wings

# --- config ---
# Wings rewrites config.yml at boot with every default filled in, so a plain
# template would differ on every run and restart Wings every time. Instead the
# role merges the keys it owns (templates/config.yml.j2) into the live file and
# compares parsed YAML, so Wings' own rewrite never counts as a change. The
# secret-bearing tasks are no_log; the report task names changed keys only.
- name: Check for an existing Wings configuration
  ansible.builtin.stat:
    path: "{{ pelican_wings_config_dir }}/config.yml"
  register: pelican_wings_config_stat

- name: Read the live Wings configuration
  ansible.builtin.slurp:
    src: "{{ pelican_wings_config_dir }}/config.yml"
  register: pelican_wings_config_slurp
  when: pelican_wings_config_stat.stat.exists
  no_log: true

- name: Merge the managed settings into the live configuration
  ansible.builtin.set_fact:
    pelican_wings_config_live: "{{ _live }}"
    pelican_wings_config_desired: "{{ _live | combine(lookup('ansible.builtin.template', 'config.yml.j2') | from_yaml, recursive=true) }}"
  vars:
    _live: >-
      {{ (pelican_wings_config_slurp.content | b64decode | from_yaml)
         if pelican_wings_config_stat.stat.exists else {} }}
  no_log: true

# The write below hides its diff (it carries the token), so name what changes.
- name: Report which Wings settings will change
  ansible.builtin.debug:
    msg: >-
      {%- set changed = [] -%}
      {%- for key, value in pelican_wings_config_desired.items() -%}
        {%- set live = pelican_wings_config_live.get(key) -%}
        {%- if value is mapping and live is mapping -%}
          {%- for sub, subvalue in value.items() if live.get(sub) != subvalue -%}
            {%- set _ = changed.append(key ~ '.' ~ sub) -%}
          {%- endfor -%}
        {%- elif live != value -%}
          {%- set _ = changed.append(key) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ changed }}
  when: pelican_wings_config_desired != pelican_wings_config_live

- name: Write the Wings configuration
  ansible.builtin.copy:
    content: "{{ pelican_wings_config_desired | to_nice_yaml(indent=2) }}"
    dest: "{{ pelican_wings_config_dir }}/config.yml"
    owner: root
    group: root
    mode: "0600"
  when: pelican_wings_config_desired != pelican_wings_config_live
  no_log: true # carries the node token
  notify: Restart wings

# Kept separate from the write, which is skipped when nothing differs.
- name: Enforce the Wings configuration's ownership and mode
  ansible.builtin.file:
    path: "{{ pelican_wings_config_dir }}/config.yml"
    owner: root
    group: root
    mode: "0600"
  when: pelican_wings_config_stat.stat.exists or pelican_wings_config_desired != pelican_wings_config_live

- name: Install the wings systemd unit
  ansible.builtin.template:
    src: wings.service.j2
    dest: /etc/systemd/system/wings.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart wings

- name: Enable and start wings
  ansible.builtin.systemd:
    name: wings
    enabled: true
    state: started

- name: Next steps -- wire this node into the public gateway
  ansible.builtin.debug:
    msg:
      - "Wings API (via the cluster gateway): https://{{ pelican_wings_fqdn }}"
      - "Tailnet IPv4 of this node: {{ tailscale_ipv4 | default('unknown -- run the tailscale_node role') }}"
      - "Expose a server: add one line inside the 25565 listener of ansible/roles/caddy_gateway/files/Caddyfile:"
      - "    import mc_server <label> {{ tailscale_ipv4 | default('<tailnet-ip>') }}:<port>"
      - "Players connect to <label>.games.fordkuppp.me. All servers share 25565, so no new DNS record and no new firewall port."
      - "Then: ansible-playbook playbooks/caddy-gateway.yaml"
