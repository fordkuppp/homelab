---
# What the collector collects is NOT configured here: that is a hand-written
# file under files/, one per host group, picked by otelcol_config_file. This
# role only installs a pinned build and ships it.

# Pinned; Renovate tracks the releases repo (see renovate.json). The contrib
# build is required -- the journald receiver is not in the core distribution.
otelcol_version: "v0.164.0"

otelcol_deb_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/{{ otelcol_version }}/otelcol-contrib_{{ otelcol_version | regex_replace('^v', '') }}_linux_amd64.deb"
otelcol_deb_cache: "/var/cache/otelcol/otelcol-contrib_{{ otelcol_version }}_amd64.deb"

# Which files/ config this host gets. Set per group in inventory/group_vars.
# No default on purpose: a new host that forgot it would otherwise get another
# box's config without complaint. The role fails fast instead.
otelcol_config_file: ""

# Groups the service user joins on top of systemd-journal, e.g. docker for a
# host whose config reads the Docker socket.
otelcol_extra_groups: []
