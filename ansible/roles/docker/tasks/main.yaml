---
- name: Install the apt transport prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian # deb822_repository needs it on the target
    state: present
    update_cache: true

# deb822_repository fetches the signing key itself and keeps it beside the
# source as /etc/apt/keyrings/docker.asc.
- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_apt_repo_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    signed_by: "{{ docker_apt_key_url }}"

# What apt_repository (and the cloud image before it) wrote before the move
# to deb822. Left in place, apt would see the same repository twice.
- name: Remove the old one-line Docker source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

# Game servers are chatty and long-lived; the default json-file driver grows
# without bound and the first symptom is a full disk, not a log warning.
- name: Cap the container log size
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        }
      }
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
