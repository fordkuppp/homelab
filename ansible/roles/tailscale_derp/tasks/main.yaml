---
- name: Fail fast when the Tailscale auth key is missing
  ansible.builtin.assert:
    that:
      - tailscale_authkey | length > 0
    fail_msg: >-
      tailscale_authkey is unset. Create a TAGGED pre-auth key in the Tailscale
      admin console, store it in Bitwarden Secrets Manager, and pass it at run
      time: -e "tailscale_authkey=$(bws secret get $BWS_TS_DERP_AUTHKEY_ID | jq -r .value)".

# --- Tailscale node (so derper can --verify-clients against the tailnet) ---
- name: Install Tailscale via the official script
  ansible.builtin.shell:
    cmd: curl -fsSL https://tailscale.com/install.sh | sh
    creates: /usr/bin/tailscale

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check tailnet connection state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join the tailnet
  ansible.builtin.command:
    cmd: "tailscale up --authkey={{ tailscale_authkey }} {{ tailscale_up_args }}"
  when: >-
    tailscale_status.rc != 0
    or (tailscale_status.stdout | from_json).BackendState | default('') != 'Running'
  no_log: true
  register: tailscale_up
  changed_when: tailscale_up.rc == 0

# `tailscale up` only runs on first join, so reconcile the mutable prefs on
# every run via `tailscale set` -- this is how a later accept-routes flip
# actually takes effect without re-authing.
- name: Reconcile tailnet preferences
  ansible.builtin.command:
    cmd: >-
      tailscale set
      --accept-dns=false
      --accept-routes={{ 'true' if tailscale_accept_routes else 'false' }}
      --ssh=false
  changed_when: false

# --- derper binary (built on the controller, shipped to the VPS) ---
# Tailscale ships no derper package or binary, so it's built from source. That
# compile is slow and network-flaky on a 1-core VPS, so build it once on the
# controller (where there's CPU/RAM + a reliable uplink) and copy the static
# binary over. Requires Go on the controller.
- name: Create the derper state directory
  ansible.builtin.file:
    path: "{{ derp_certdir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Build derper for {{ derp_build_goos }}/{{ derp_build_goarch }} on the controller
  delegate_to: localhost
  run_once: true
  become: false # build as the local user (uses your Go cache), not root
  ansible.builtin.command:
    cmd: "go install tailscale.com/cmd/derper@{{ derper_version }}"
  environment:
    GOOS: "{{ derp_build_goos }}"
    GOARCH: "{{ derp_build_goarch }}"
  changed_when: false

- name: Resolve the controller's Go build paths
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.command:
    cmd: go env GOPATH GOHOSTOS GOHOSTARCH
  register: controller_go_env
  changed_when: false

# go install drops a cross build in bin/<goos>_<goarch>/ but a native build
# straight in bin/, so choose the path based on whether this is a cross build.
- name: Ship the derper binary to the VPS
  ansible.builtin.copy:
    src: >-
      {{ controller_go_env.stdout_lines[0] }}/bin/{{
        (derp_build_goos ~ '_' ~ derp_build_goarch ~ '/')
        if (derp_build_goos != controller_go_env.stdout_lines[1]
            or derp_build_goarch != controller_go_env.stdout_lines[2])
        else '' }}derper
    dest: "{{ derp_bin }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart derper

# --- service ---
- name: Install the derper systemd unit
  ansible.builtin.template:
    src: derper.service.j2
    dest: /etc/systemd/system/derper.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart derper

- name: Enable and start derper
  ansible.builtin.systemd:
    name: derper
    enabled: true
    state: started

- name: Next steps -- add the relay to your tailnet and open the ports
  ansible.builtin.debug:
    msg:
      - "DNS: create A record  {{ derp_hostname }} -> {{ derp_bind_ip or ansible_host }}"
      - "Firewall/provider SG on {{ derp_bind_ip or ansible_host }}: open  443/tcp, 80/tcp (ACME), 3478/udp"
      - "Tailnet ACL -> add a custom DERP region (keep defaults as fallback):"
      - >-
        "derpMap": { "OmitDefaultRegions": false, "Regions": { "900":
        { "RegionID": 900, "RegionCode": "bkk", "Nodes":
        [ { "Name": "1", "RegionID": 900, "HostName": "{{ derp_hostname }}" } ] } } }
      - "Verify from a client:  tailscale netcheck   (your 'bkk' region should appear)"
