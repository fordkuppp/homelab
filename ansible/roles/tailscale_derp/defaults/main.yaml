---
# --- Tailscale node ---
# Required. A tagged pre-auth key OR an OAuth client secret (tskey-client-...,
# non-expiring), passed at run time (see group_vars/edge.yaml).
tailscale_authkey: ""
tailscale_hostname: "{{ inventory_hostname }}"
# Tags advertised on join. REQUIRED when authing with an OAuth client secret
# (must be a subset of the client's tags); harmless with a tagged pre-auth key.
tailscale_tags: ""
# A relay needs no tailnet DNS or SSH. Route acceptance is off by default but
# flipped on for the edge node (group_vars/edge.yaml) so the co-located Caddy
# gateway can reach the homelab over the tailnet.
tailscale_accept_routes: false
tailscale_up_args: >-
  --accept-dns=false
  --accept-routes={{ 'true' if tailscale_accept_routes else 'false' }}
  --ssh=false --hostname={{ tailscale_hostname }}
  {{ ('--advertise-tags=' ~ tailscale_tags) if tailscale_tags else '' }}

# --- DERP relay (derper) ---
derp_hostname: "derp.example.com"
# Which IP derper's HTTPS listener binds. Empty = all interfaces. Set to the
# first public IP once Caddy shares the box, so Caddy can own :443 on the second.
derp_bind_ip: ""
derp_https_port: 443
derp_http_port: 80          # HTTP->HTTPS redirect + ACME HTTP-01 challenge
derp_stun_port: 3478
derp_home: /var/lib/derper
derp_certdir: "{{ derp_home }}/certs"
derp_bin: /usr/local/bin/derper
# Only clients present in this tailnet may use the relay (needs local tailscaled).
derp_verify_clients: true

# --- build (cross-compiled on the Ansible controller; needs Go there) ---
derper_version: "v1.104.2"
derp_build_goos: linux
derp_build_goarch: amd64
